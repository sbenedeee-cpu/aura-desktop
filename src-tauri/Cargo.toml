[package]
name = "aura-desktop"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "aura_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
# SEC-001: value-level envelope encryption (database-agnostic per ADR-003).
sha2 = "0.10"
hex = "0.4"
getrandom = "0.3"
chacha20poly1305 = "0.10"
tauri-plugin-dialog = "2"
argon2 = "0.5"

# EXP-006: the Voice Pipeline. whisper-rs (whisper.cpp) runs local
# speech-to-text entirely on-device; ureq is a tiny synchronous HTTPS client
# used only for optional cloud STT (Groq Whisper free tier, then OpenAI
# fallback). Both are gated behind the `voice` feature, which is enabled by
# default because push-to-talk is core product surface (PRD §7.2).
[features]
default = ["voice"]
voice = ["whisper-rs", "ureq", "sha1"]

[dependencies.whisper-rs]
version = "0.16"
optional = true

[dependencies.ureq]
version = "2"
optional = true
# `json` enables send_json/into_json on ureq requests — the voice and brain
# tiers both speak JSON over these endpoints.
features = ["json"]

[dependencies.sha1]
version = "0.10"
optional = true

# SEC-001: DPAPI key wrapping (Windows only).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Security_Cryptography",
  "Win32_System_Com",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"

[dev-dependencies]
tempfile = "3"
